<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">OpenCode MCP</title>
  <desc id="bannerDesc">NONES banner for OpenCode MCP, a local MCP server for an existing OpenCode 2 service.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#090b10"/>
      <stop offset="0.55" stop-color="#0d1119"/>
      <stop offset="1" stop-color="#111722"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.17" cy="0.28" r="0.72">
      <stop offset="0" stop-color="#2a6f97" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#153247" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="72" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#243044" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="320"/>
    </clipPath>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>
  <g clip-path="url(#frame)" opacity="0.35">
    <rect width="1200" height="320" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#1c2636"/>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(72 44)">
      <rect width="118" height="34" rx="17" fill="#111925" stroke="#27364b"/>
      <circle cx="19" cy="17" r="4" fill="#7dd3fc"/>
      <text x="34" y="22" font-size="13" font-weight="700" letter-spacing="2.4" fill="#dcecff">NONES</text>
    </g>
    <text x="1128" y="68" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="0.6" fill="#7f8da3">@nones/opencode-mcp</text>
    <text x="70" y="192" font-size="94" font-weight="700" letter-spacing="-2.5" fill="#f4f7fb">OpenCode MCP</text>
    <text x="74" y="237" font-size="21" fill="#93a1b5">Local MCP server for an already running OpenCode 2 service</text>
    <path d="M72 270H1128" stroke="url(#rule)" stroke-width="1.5"/>
    <text x="72" y="299" font-size="11.5" font-weight="600" letter-spacing="2.2" fill="#637086">TYPED SDK  ·  STDIO  ·  SAFETY GATES</text>
    <text x="1128" y="299" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" letter-spacing="1.3" fill="#637086">NPMJS.COM/ORG/NONES</text>
  </g>
</svg>
